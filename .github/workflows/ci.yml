name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Convex backend (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The root lockfile was generated with legacy peer-dependency resolution (Expo/Clerk peers).
      - run: npm ci --legacy-peer-deps
      - name: Typecheck Convex functions
        run: npx tsc -p convex --noEmit
      - name: Run test suite
        run: npx vitest run

  dashboard:
    name: Staff dashboard (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
      # The dashboard imports convex/_generated from the repo root, so root deps are needed too.
      - run: npm ci --legacy-peer-deps
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
